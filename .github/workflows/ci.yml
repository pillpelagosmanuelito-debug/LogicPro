name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analizar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter (canal stable, sin version fijada)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar proyectos nativos android/ios
        run: flutter create --platforms=android,ios --org com.logicpro.app --project-name logicpro .

      - name: Obtener dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

  build_apk:
    name: Compilar APK de release
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter (canal stable, sin version fijada)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar proyectos nativos android/ios
        run: flutter create --platforms=android,ios --org com.logicpro.app --project-name logicpro .

      - name: Obtener dependencias
        run: flutter pub get

      - name: Generar iconos de la app
        run: dart run flutter_launcher_icons

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: logicpro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
